name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      # MIT Kerberos itself, as a judge: a real KDC issues the ticket and
      # MIT's own gss-client presents it. Ubuntu's krb5 packages do not ship
      # gss-client (it lives in the sample code), so the bottle is used.
      - name: MIT Kerberos
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsS https://pkgx.sh | sh
          timeout 300 ./test/kdc.sh "$RUNNER_TEMP/krb5"
          cat "$RUNNER_TEMP/krb5/env" >> "$GITHUB_ENV"
      # And the judge must be reachable in THIS lane: a skip here looks
      # exactly like a pass.
      - name: the judge is there
        if: matrix.os == 'ubuntu-latest'
        run: pkgx +kerberos.org -- klist
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 ./...
        env:
          KRB5_REQUIRE_JUDGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      # ⛔ The judge belongs in EVERY lane that runs the tests, not only the
      # one named "test": without it the differential test skips, and a skip
      # is not a failure.
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          timeout 300 ./test/kdc.sh "$RUNNER_TEMP/krb5"
          cat "$RUNNER_TEMP/krb5/env" >> "$GITHUB_ENV"
      - run: go test -race -count=1 ./...
        env:
          KRB5_REQUIRE_JUDGE: "1"

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
