name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # MIT Kerberos itself, as a judge: a real KDC issues the ticket and
      # MIT's own gss-client presents it. Ubuntu's krb5 packages do not ship
      # gss-client (it lives in the sample code), so the bottle is used.
      - name: MIT Kerberos
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsS https://pkgx.sh | sh
          timeout 300 ./test/kdc.sh "$RUNNER_TEMP/krb5"
          cat "$RUNNER_TEMP/krb5/env" >> "$GITHUB_ENV"
      # And the judge must be reachable in THIS lane: a skip here looks
      # exactly like a pass.
      - name: the judge is there
        if: matrix.os == 'ubuntu-latest'
        run: pkgx +kerberos.org -- klist
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 ./...
        env:
          KRB5_REQUIRE_JUDGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # ⛔ "ok  github.com/go-authn/krb5  0.054s" is not evidence the judge
      # ran. The test logs the principal MIT authenticated as; this looks for
      # that line and fails without it, so a judge that silently stopped
      # running cannot pass as a green lane.
      - name: the judge actually ran
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          KRB5_REQUIRE_JUDGE: "1"
        run: |
          go test -count=1 -v -run TestMITClientAgainstThisAcceptor ./... | tee judge.log
          grep -q "authenticated as alice@" judge.log || {
            echo "::error::the differential test did not authenticate anybody"; exit 1; }

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge belongs in EVERY lane that runs the tests, not only the
      # one named "test": without it the differential test skips, and a skip
      # is not a failure.
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          timeout 300 ./test/kdc.sh "$RUNNER_TEMP/krb5"
          cat "$RUNNER_TEMP/krb5/env" >> "$GITHUB_ENV"
      - run: go test -race -count=1 ./...
        env:
          KRB5_REQUIRE_JUDGE: "1"
      - name: the judge actually ran
        shell: bash
        env:
          KRB5_REQUIRE_JUDGE: "1"
        run: |
          go test -race -count=1 -v -run TestMITClientAgainstThisAcceptor ./... | tee judge.log
          grep -q "authenticated as alice@" judge.log || {
            echo "::error::the differential test did not authenticate anybody"; exit 1; }

  # The toolchain is the one go.mod names (go-version-file), so a floor too
  # low to carry the standard library's fixes is a finding HERE: govulncheck
  # exits 3 on any, and the job fails.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x, 386, arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test
        run: |
          # ⛔ Resolve the emulator, accept EITHER binary name, and FAIL when neither
          # is there -- a lane that reports success for an architecture it never ran is
          # the one outcome this matrix exists to rule out. qemu-user ships the dynamic
          # qemu-<arch>; qemu-user-static, now a virtual package, shipped the static one.
          qemu_for() {
            for cand in "qemu-$1-static" "qemu-$1"; do
              command -v "$cand" >/dev/null 2>&1 && { printf '%s\n' "$cand"; return 0; }
            done
            echo "::error::no qemu user emulator for $1 (looked for qemu-$1-static and qemu-$1)" >&2
            return 1
          }
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64) e="$(qemu_for riscv64)" || exit 1; echo "running riscv64 under $e"; GOARCH=riscv64 go test -count=1 -exec="$e" ./... ;;
            loong64) e="$(qemu_for loongarch64)" || exit 1; echo "running loong64 under $e"; GOARCH=loong64 go test -count=1 -exec="$e" ./... ;;
            ppc64le) e="$(qemu_for ppc64le)" || exit 1; echo "running ppc64le under $e"; GOARCH=ppc64le go test -count=1 -exec="$e" ./... ;;
            s390x) e="$(qemu_for s390x)" || exit 1; echo "running s390x under $e"; GOARCH=s390x   go test -count=1 -exec="$e" ./... ;;
            # 32-bit: 386 runs natively on the amd64 runner (qemu-i386 loses float
            # state across preemption); arm under qemu.
            386)      GOARCH=386     go test -count=1 ./... ;;
            arm) e="$(qemu_for arm)" || exit 1; echo "running arm under $e"; GOARCH=arm     go test -count=1 -exec="$e" ./... ;;
          esac

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge belongs in EVERY lane that runs the tests. Without a realm
      # the differential tests skip, and the figure this lane prints would be
      # of a run that never spoke to MIT.
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          timeout 300 ./test/kdc.sh "$RUNNER_TEMP/krb5"
          cat "$RUNNER_TEMP/krb5/env" >> "$GITHUB_ENV"
      - name: Measure
        env:
          KRB5_REQUIRE_JUDGE: "1"
        run: |
          set -euo pipefail
          # The floor is what is actually reached today, not a round number.
          # What is left uncovered is named rather than hidden: asn1.Marshal
          # of a constant OID, and the branches that fire only when the
          # machine's CSPRNG fails.
          FLOOR=90.0
          go test -count=1 -coverprofile=cover.out -coverpkg=./... ./... >/dev/null
          go tool cover -func=cover.out | tail -20
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%"
          # Written as an `if` rather than `awk ... && { ... }`: in that form
          # the list's status is awk's, and a lane comfortably above its floor
          # fails saying nothing about why.
          if awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}'; then
            echo "::error::coverage ${cov}% fell below the recorded floor ${FLOOR}%"
            exit 1
          fi
